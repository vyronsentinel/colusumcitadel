# Render Blueprint — free deploy of PayrollPro (web service + PostgreSQL)
# Docs: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this repo to GitHub (public or private).
#   2. On Render: New → Blueprint → connect the repo. Render reads this file.
#   3. It creates a free Postgres DB + a free web service, wired together.
#   4. Set the two secrets marked "sync: false" when prompted (see DEPLOY-FREE.md).

services:
  - type: web
    name: payrollpro-api
    runtime: node
    plan: free
    region: singapore            # closest free region to PH; change if you like
    buildCommand: npm install
    # migrate + seed are idempotent, so it's safe to run them on every boot.
    startCommand: node src/db.js migrate && node src/seed.js && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_ACCESS_SECRET
        generateValue: true       # Render generates a strong random value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false               # you paste a 64-hex-char key (see guide)
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@acme.ph
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false               # set your own strong password
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: payrollpro-db
          property: connectionString

databases:
  - name: payrollpro-db
    plan: free
    region: singapore
